<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>弈拍 · 围棋音游（含编辑器）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05070c;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;padding:16px 22px;display:flex;
  justify-content:space-between;align-items:flex-start;pointer-events:none;
  color:#9ef4ff;font-variant-numeric:tabular-nums;z-index:10}
#score{font-size:26px;font-weight:600;letter-spacing:1px;
  text-shadow:0 0 16px rgba(60,216,255,.6)}
#scoreLbl{font-size:10px;opacity:.45;letter-spacing:3px;margin-top:3px}
#combo{font-size:10px;opacity:0;transition:opacity .2s;text-align:right;
  letter-spacing:2px;line-height:1.6}
#combo.on{opacity:1}
#combo b{font-size:28px;display:block;line-height:1;letter-spacing:0}
#judge{position:fixed;left:50%;top:56%;transform:translate(-50%,-50%);
  font-size:20px;font-weight:700;letter-spacing:4px;pointer-events:none;
  opacity:0;color:#7ef0ff;text-shadow:0 0 22px currentColor;z-index:10}
#judge.show{animation:jpop .5s ease-out}
@keyframes jpop{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.65)}
  100%{opacity:0;transform:translate(-50%,-110%) scale(1.15)}
}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;
  justify-content:center;align-items:center;background:rgba(5,7,12,.88);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:#cfe9f5;text-align:center;padding:28px;transition:opacity .35s;z-index:20}
#overlay.hide{opacity:0;pointer-events:none}
#overlay h1{font-size:32px;letter-spacing:10px;margin-bottom:16px;
  color:#9ef4ff;text-shadow:0 0 28px rgba(60,216,255,.55);font-weight:500}
#overlay p{font-size:13px;line-height:2;opacity:.6;max-width:340px;margin-bottom:30px}
#overlay .res{font-size:14px;line-height:2;opacity:.85;margin-bottom:24px}
#overlay .res em{color:#7ef0ff;font-style:normal;font-size:22px;font-weight:600}
#btn{padding:14px 52px;border-radius:32px;border:1px solid rgba(126,240,255,.45);
  background:rgba(60,216,255,.08);color:#9ef4ff;font-size:16px;letter-spacing:5px;
  cursor:pointer;transition:.18s;font-family:inherit}
#btn:active{transform:scale(.94);background:rgba(60,216,255,.22)}

/* ===== 编辑器 UI ===== */
#editBar{position:fixed;top:0;left:0;right:0;padding:8px 12px;
  background:rgba(11,18,32,.95);display:none;gap:8px;align-items:center;
  flex-wrap:wrap;border-bottom:1px solid rgba(90,190,225,.3);font-size:12px;z-index:30;
  color:#9ef4ff}
#editBar.show{display:flex}
#editBar button{padding:5px 12px;border-radius:6px;border:1px solid rgba(126,240,255,.4);
  background:rgba(60,216,255,.1);color:#9ef4ff;font-size:12px;cursor:pointer;font-family:inherit}
#editBar button.on{background:rgba(60,216,255,.4)}
#editBar input{width:56px;padding:4px 6px;border-radius:4px;
  border:1px solid rgba(126,240,255,.3);background:#05070c;color:#9ef4ff;
  font-size:12px;text-align:center;font-family:inherit}
#editBar label{display:flex;align-items:center;gap:4px;opacity:.85}

#editToggle{position:fixed;right:14px;bottom:14px;width:46px;height:46px;
  border-radius:50%;border:1px solid rgba(126,240,255,.45);
  background:rgba(60,216,255,.12);color:#9ef4ff;font-size:18px;cursor:pointer;
  z-index:25;font-family:inherit}
#editToggle:active{background:rgba(60,216,255,.3)}

#jsonOut{position:fixed;left:0;right:0;bottom:0;height:140px;padding:8px 12px;
  background:rgba(11,18,32,.96);border-top:1px solid rgba(90,190,225,.3);
  font-family:monospace;font-size:11px;color:#8affc1;overflow:auto;
  white-space:pre;display:none;z-index:30}
#jsonOut.show{display:block}

#editHint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  color:#9ef4ff;font-size:14px;opacity:.7;pointer-events:none;display:none;z-index:15}
#editHint.show{display:block}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div><div id="score">0</div><div id="scoreLbl">SCORE</div></div>
  <div id="combo"><b>0</b>COMBO</div>
</div>
<div id="judge"></div>

<div id="overlay">
  <h1>弈 拍</h1>
  <p>扫描线每经过一行，点击该行上的交叉点落子。<br>
     越接近节拍，判定越高。<br>
     你落黑子后，AI 会走白子。<br>
     按 E 键（或右下角按钮）进入谱面编辑。<br>
     开始前有 4 拍预备。</p>
  <button id="btn">开 始</button>
</div>

<!-- 编辑器工具栏 -->
<div id="editBar">
  <button id="mTap" class="on">短按</button>
  <button id="mHold">长按</button>
  <label>拍 <input id="beat" type="number" value="0" step="0.5" min="0"></label>
  <label>长按拍数 <input id="dur" type="number" value="2" step="0.5" min="0.5"></label>
  <button id="delBtn">删除模式</button>
  <button id="undoBtn">撤销</button>
  <button id="clearBtn">清空</button>
  <button id="copyBtn">复制JSON</button>
  <button id="closeEdit">退出编辑</button>
</div>

<div id="editToggle">✎</div>
<div id="jsonOut"></div>
<div id="editHint">点击交叉点添加音符</div>

<script>
(() => {
'use strict';

// ==================== 基础配置 ====================
const BPM = 120;
const BEAT = 60 / BPM;
const CYCLE = 16;
const N = 9;

const JUDGE = { perfect: 70, good: 140, bad: 220 };
const SCALE = [261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25,783.99];
const CHORDS = [110.00, 87.31, 130.81, 98.00];

// 谱面：支持 tap / hold
let CHART = [
  { beat: 0,  row: 0, col: 4, type: 'tap' },
  { beat: 2,  row: 2, col: 2, type: 'tap' },
  { beat: 4,  row: 4, col: 4, type: 'hold', duration: 2 },
  { beat: 8,  row: 8, col: 4, type: 'tap' },
  { beat: 9,  row: 7, col: 6, type: 'tap' },
  { beat: 11, row: 5, col: 4, type: 'hold', duration: 1.5 },
  { beat: 14, row: 3, col: 6, type: 'tap' },
  { beat: 16, row: 0, col: 2, type: 'tap' },
  { beat: 18, row: 2, col: 6, type: 'hold', duration: 2 },
  { beat: 22, row: 6, col: 6, type: 'tap' },
  { beat: 24, row: 8, col: 2, type: 'hold', duration: 1 },
  { beat: 27, row: 5, col: 2, type: 'tap' },
  { beat: 29, row: 3, col: 6, type: 'tap' },
];
let END_BEAT = 34;

// ==================== 画布 ====================
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let boardX = 0, boardY = 0, cell = 40, gridPx = 320;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}

function layout() {
  const s = Math.min(W, H);
  const pad = s * 0.16;
  const size = s - pad * 2;
  cell = size / (N - 1);
  gridPx = size;
  boardX = (W - size) / 2;
  boardY = (H - size) / 2;
}

window.addEventListener('resize', resize);

// ==================== 音频 ====================
let actx = null, master = null, noiseBuf = null;

function initAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain();
  master.gain.value = 0.32;
  master.connect(actx.destination);
}

function getNoise() {
  if (noiseBuf) return noiseBuf;
  const len = Math.floor(actx.sampleRate * 0.15);
  noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
}

function playKick(t) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.setValueAtTime(170, t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
  g.gain.setValueAtTime(0.9, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + 0.4);
}

function playHat(t) {
  const s = actx.createBufferSource();
  s.buffer = getNoise();
  const f = actx.createBiquadFilter();
  f.type = 'highpass'; f.frequency.value = 8500;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.22, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.055);
  s.connect(f).connect(g).connect(master);
  s.start(t); s.stop(t + 0.1);
}

function playBass(freq, t, dur) {
  const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
  o.type = 'sawtooth';
  o.frequency.value = freq;
  f.type = 'lowpass';
  f.frequency.setValueAtTime(700, t);
  f.frequency.exponentialRampToValueAtTime(180, t + dur);
  g.gain.setValueAtTime(0.001, t);
  g.gain.linearRampToValueAtTime(0.42, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(f).connect(g).connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}

function playPitch(freq, t) {
  const o1 = actx.createOscillator(), o2 = actx.createOscillator();
  const g = actx.createGain(), g2 = actx.createGain();
  o1.type = 'sine';     o1.frequency.value = freq;
  o2.type = 'triangle'; o2.frequency.value = freq * 2;
  g2.gain.value = 0.28;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.55, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
  o1.connect(g);
  o2.connect(g2).connect(g);
  g.connect(master);
  o1.start(t); o2.start(t);
  o1.stop(t + 0.9); o2.stop(t + 0.9);
}

function playWhite(t) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.value = 196.00;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.35, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + 0.65);
}

function playMiss(t) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(180, t);
  o.frequency.exponentialRampToValueAtTime(60, t + 0.18);
  g.gain.setValueAtTime(0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + 0.22);
}

// ==================== 游戏状态 ====================
let started = false;
let ended = false;
let startTime = 0;
let nextBeatToSchedule = 0;
let score = 0, combo = 0, maxCombo = 0;
let perfectCount = 0, goodCount = 0, badCount = 0, missCount = 0;
let notes = [];
const particles = [];
const floaters = [];

let board = Array.from({ length: N }, () => Array(N).fill(0));
let aiPending = false;
let aiMoveBeat = 0;

// ==================== 编辑器状态 ====================
let editMode = false;
let editNotes = [];        // 编辑中的音符列表
let editMode2 = 'tap';     // 当前添加类型
let editDelete = false;    // 删除模式
let editHistory = [];      // 撤销栈

function buildNotes() {
  notes = CHART.map(n => ({
    beat: n.beat,
    row: n.row,
    col: n.col,
    type: n.type || 'tap',
    duration: n.duration || 0,
    hit: false,
    missed: false,
    holding: false,
    holdStart: 0,
    holdEnd: 0,
    holdBroken: false
  }));
}

function resetBoard() {
  board = Array.from({ length: N }, () => Array(N).fill(0));
  aiPending = false;
  aiMoveBeat = 0;
}

function scanPos(beats) {
  let u = beats % CYCLE;
  if (u < 0) u += CYCLE;
  return u <= (N - 1) ? u : CYCLE - u;
}

// ==================== 围棋逻辑 ====================
function getGroup(r, c, b) {
  const color = b[r][c];
  if (!color) return [];
  const visited = new Set();
  const group = [];
  const stack = [[r, c]];
  visited.add(r + ',' + c);
  while (stack.length) {
    const [cr, cc] = stack.pop();
    group.push([cr, cc]);
    for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nr = cr + dr, nc = cc + dc;
      if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;
      const key = nr + ',' + nc;
      if (visited.has(key)) continue;
      if (b[nr][nc] === color) {
        visited.add(key);
        stack.push([nr, nc]);
      }
    }
  }
  return group;
}

function countLiberties(group, b) {
  const libs = new Set();
  for (const [r, c] of group) {
    for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;
      if (b[nr][nc] === 0) libs.add(nr + ',' + nc);
    }
  }
  return libs.size;
}

function tryPlace(b, r, c, color) {
  if (b[r][c] !== 0) return null;
  const saved = b.map(row => row.slice());
  b[r][c] = color;
  const opponent = color === 1 ? 2 : 1;
  const captured = [];

  for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
    const nr = r + dr, nc = c + dc;
    if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;
    if (b[nr][nc] === opponent) {
      const group = getGroup(nr, nc, b);
      if (countLiberties(group, b) === 0) {
        for (const [gr, gc] of group) {
          b[gr][gc] = 0;
          captured.push([gr, gc]);
        }
      }
    }
  }

  const myGroup = getGroup(r, c, b);
  if (countLiberties(myGroup, b) === 0) {
    for (let i = 0; i < N; i++) b[i] = saved[i].slice();
    return null;
  }
  return captured;
}

// ==================== AI ====================
function aiChooseMove(beats) {
  const forbidden = new Set();
  for (const n of notes) {
    if (!n.hit && !n.missed && n.beat > beats && n.beat < beats + 2.5) {
      forbidden.add(n.row + ',' + n.col);
    }
  }

  let best = null;
  let bestScore = -Infinity;

  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      if (board[r][c] !== 0) continue;
      if (forbidden.has(r + ',' + c)) continue;

      const bCopy = board.map(row => row.slice());
      const captured = tryPlace(bCopy, r, c, 2);
      if (captured === null) continue;

      let s = captured.length * 100;

      let connect = 0;
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < N && nc >= 0 && nc < N && board[nr][nc] === 2) connect++;
      }
      s += connect * 15;

      const centerDist = Math.abs(r - 4) + Math.abs(c - 4);
      s += (8 - centerDist) * 2;

      s += Math.random() * 8;

      if (s > bestScore) {
        bestScore = s;
        best = [r, c];
      }
    }
  }
  return best;
}

function doAIMove(beats) {
  const move = aiChooseMove(beats);
  if (!move) return;
  const [r, c] = move;
  const captured = tryPlace(board, r, c, 2);
  if (captured === null) return;

  playWhite(actx.currentTime);
  const px = boardX + c * cell;
  const py = boardY + r * cell;
  spawnBurst(px, py, '#ffd479');
  if (captured.length > 0) {
    spawnBurst(px, py, '#ff9f43');
  }
}

// ==================== 音乐调度 ====================
function scheduler() {
  if (!started) return;
  const horizon = actx.currentTime + 0.25;
  while (true) {
    const t = startTime + nextBeatToSchedule * BEAT;
    if (t > horizon) break;
    if (t >= actx.currentTime - 0.05 && nextBeatToSchedule <= END_BEAT) {
      scheduleBeat(nextBeatToSchedule, t);
    }
    nextBeatToSchedule++;
    if (nextBeatToSchedule > END_BEAT + 4) break;
  }
}

function scheduleBeat(b, t) {
  const m = ((b % 4) + 4) % 4;
  if (m === 0 || m === 2) playKick(t);
  if (m === 1 || m === 3) playHat(t);
  if (m === 0 || m === 2) {
    const chord = CHORDS[Math.floor((((b % 16) + 16) % 16) / 4)];
    playBass(chord, t, BEAT * 1.6);
  }
}

// ==================== 判定 ====================
function tryHit(r, c) {
  const now = actx.currentTime;
  const ms = now * 1000;

  let best = null, bestAbs = Infinity;

  for (const n of notes) {
    if (n.hit || n.missed) continue;
    if (n.row !== r || n.col !== c) continue;
    if (n.type === 'hold' && n.holding) continue;

    const t = (startTime + n.beat * BEAT) * 1000;
    const a = Math.abs(ms - t);
    if (a < JUDGE.bad && a < bestAbs) { bestAbs = a; best = n; }
  }

  const px = boardX + c * cell, py = boardY + r * cell;

  if (!best) {
    spawnRipple(px, py, 'rgba(255,90,120,0.75)');
    return;
  }

  let j;
  if (bestAbs < JUDGE.perfect) { j = 'PERFECT'; perfectCount++; score += 100; combo++; }
  else if (bestAbs < JUDGE.good) { j = 'GOOD'; goodCount++; score += 60; combo++; }
  else { j = 'BAD'; badCount++; score += 20; combo = 0; }

  maxCombo = Math.max(maxCombo, combo);
  playPitch(SCALE[best.col], now);

  if (board[r][c] === 0) {
    const captured = tryPlace(board, r, c, 1);
    if (captured !== null) {
      if (captured.length > 0) {
        for (const [gr, gc] of captured) {
          spawnBurst(boardX + gc * cell, boardY + gr * cell, '#ff9f43');
        }
      }
      aiPending = true;
      aiMoveBeat = (actx.currentTime - startTime) / BEAT + 1.5;
    }
  }

  const color = j === 'PERFECT' ? '#7ef0ff' : j === 'GOOD' ? '#8affc1' : '#ffd479';
  spawnBurst(px, py, color);
  floatText(j, px, py, color);
  showJudge(j, color);

  if (best.type === 'hold') {
    best.hit = true;
    best.holding = true;
    best.holdStart = now;
    best.holdEnd = startTime + (best.beat + best.duration) * BEAT;
  } else {
    best.hit = true;
  }

  updateHUD();
}

function checkMisses() {
  const ms = actx.currentTime * 1000;
  for (const n of notes) {
    if (n.hit || n.missed) continue;
    const t = (startTime + n.beat * BEAT) * 1000;
    if (ms > t + JUDGE.bad) {
      n.missed = true;
      missCount++;
      combo = 0;
      playMiss(actx.currentTime);
      showJudge('MISS', '#ff5a78');
      updateHUD();
    }
  }
}

function checkHolds() {
  const now = actx.currentTime;
  for (const n of notes) {
    if (!n.holding) continue;
    if (now >= n.holdEnd) {
      n.holding = false;
      n.hit = true;
      perfectCount++;
      score += 150;
      combo++;
      maxCombo = Math.max(maxCombo, combo);
      playPitch(SCALE[n.col] * 1.5, now);
      spawnBurst(boardX + n.col * cell, boardY + n.row * cell, '#8affc1');
      updateHUD();
    }
  }
}

function releaseHold() {
  const now = actx.currentTime;
  for (const n of notes) {
    if (n.holding) {
      const remain = n.holdEnd - now;
      if (remain > 0.15) {
        n.holding = false;
        n.holdBroken = true;
        n.missed = true;
        combo = 0;
        missCount++;
        playMiss(now);
        showJudge('BREAK', '#ff5a78');
        updateHUD();
      } else {
        n.holding = false;
      }
    }
  }
}

// ==================== 特效 ====================
function spawnBurst(x, y, color) {
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 90 + Math.random() * 240;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      decay: 1.8 + Math.random() * 1.4,
      color,
      size: 1.4 + Math.random() * 2.2
    });
  }
  particles.push({
    ring: true, x, y, r: cell * 0.35, maxR: cell * 1.35,
    life: 1, decay: 3.2, color
  });
}

function spawnRipple(x, y, color) {
  particles.push({
    ring: true, x, y, r: cell * 0.2, maxR: cell * 0.75,
    life: 1, decay: 4.5, color
  });
}

function floatText(txt, x, y, color) {
  floaters.push({ txt, x, y, life: 1, color });
}

function showJudge(txt, color) {
  const el = document.getElementById('judge');
  el.textContent = txt;
  el.style.color = color || '#7ef0ff';
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  const cb = document.getElementById('combo');
  if (combo > 1) {
    cb.classList.add('on');
    cb.querySelector('b').textContent = combo;
  } else {
    cb.classList.remove('on');
  }
}

// ==================== 渲染 ====================
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBoard() {
  const m = cell * 0.85;
  ctx.save();
  ctx.shadowColor = 'rgba(60,200,255,0.18)';
  ctx.shadowBlur = 50;
  ctx.fillStyle = 'rgba(10,18,30,0.92)';
  roundRect(boardX - m, boardY - m, gridPx + m * 2, gridPx + m * 2, 18);
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = 'rgba(90,190,225,0.22)';
  ctx.lineWidth = 1;
  roundRect(boardX - m, boardY - m, gridPx + m * 2, gridPx + m * 2, 18);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(96,186,220,0.22)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < N; i++) {
    const p = i * cell;
    ctx.moveTo(boardX, boardY + p);
    ctx.lineTo(boardX + gridPx, boardY + p);
    ctx.moveTo(boardX + p, boardY);
    ctx.lineTo(boardX + p, boardY + gridPx);
  }
  ctx.stroke();

  const stars = [[2,2],[2,6],[4,4],[6,2],[6,6]];
  ctx.fillStyle = 'rgba(96,186,220,0.38)';
  for (const [r, c] of stars) {
    ctx.beginPath();
    ctx.arc(boardX + c * cell, boardY + r * cell, Math.max(2.2, cell * 0.055), 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawStone(x, y, color, scale = 1, alpha = 1) {
  const r = cell * 0.40 * scale;
  ctx.save();
  ctx.globalAlpha = alpha;

  ctx.beginPath();
  ctx.ellipse(x + r * 0.08, y + r * 0.14, r * 0.95, r * 0.85, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fill();

  const g = ctx.createRadialGradient(
    x - r * 0.35, y - r * 0.38, r * 0.08,
    x, y, r
  );
  if (color === 1) {
    g.addColorStop(0, '#5c7391');
    g.addColorStop(0.42, '#22303f');
    g.addColorStop(1, '#070b12');
  } else {
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.42, '#d8e8f0');
    g.addColorStop(1, '#8aa0b0');
  }
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();

  ctx.strokeStyle = color === 1 ? 'rgba(126,240,255,0.55)' : 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(x - r * 0.3, y - r * 0.32, r * 0.22, 0, Math.PI * 2);
  ctx.fillStyle = color === 1 ? 'rgba(190,240,255,0.30)' : 'rgba(255,255,255,0.5)';
  ctx.fill();

  ctx.restore();
}

function drawStones() {
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const v = board[r][c];
      if (v === 0) continue;
      drawStone(boardX + c * cell, boardY + r * cell, v);
    }
  }
}

function drawHoldNote(n, beats) {
  const x = boardX + n.col * cell;
  const y0 = boardY + n.row * cell;
  const endRow = scanPos(n.beat + n.duration);
  const y1 = boardY + endRow * cell;

  const dt = n.beat - beats;
  if (dt > 3.6 || dt + n.duration < -0.5) return;

  const prox = Math.max(0, 1 - Math.abs(dt) / 3.2);
  const alpha = n.holding ? 1 : 0.12 + prox * 0.85;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = n.holding ? '#b8f6ff' : 'rgba(126,240,255,0.72)';
  ctx.lineWidth = cell * 0.22;
  ctx.lineCap = 'round';
  ctx.shadowColor = '#3ad8ff';
  ctx.shadowBlur = 16;
  ctx.beginPath();
  ctx.moveTo(x, y0);
  ctx.lineTo(x, y1);
  ctx.stroke();

  ctx.fillStyle = '#b8f6ff';
  ctx.beginPath();
  ctx.arc(x, y0, cell * 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x, y1, cell * 0.15, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawNotes(beats) {
  for (const n of notes) {
    if (n.missed || (n.hit && !n.holding)) continue;

    const x = boardX + n.col * cell;
    const y = boardY + n.row * cell;

    if (n.type === 'hold') {
      drawHoldNote(n, beats);
      continue;
    }

    const dt = n.beat - beats;
    if (dt > 3.6 || dt < -0.6) continue;

    const prox = Math.max(0, 1 - Math.abs(dt) / 3.2);
    const near = Math.abs(dt) < 0.45;

    ctx.save();
    ctx.globalAlpha = 0.12 + prox * 0.85;

    ctx.strokeStyle = near ? '#b8f6ff' : 'rgba(126,240,255,0.72)';
    ctx.lineWidth = 1.6 + prox * 2.2;
    ctx.shadowColor = '#3ad8ff';
    ctx.shadowBlur = 8 + prox * 24;
    ctx.beginPath();
    ctx.arc(x, y, cell * 0.40, 0, Math.PI * 2);
    ctx.stroke();

    ctx.shadowBlur = 14 + prox * 22;
    ctx.fillStyle = 'rgba(190,248,255,' + (0.18 + prox * 0.62) + ')';
    ctx.beginPath();
    ctx.arc(x, y, cell * 0.40 * (0.34 + prox * 0.28), 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

function drawScanline(pos) {
  const y = boardY + pos * cell;
  const x0 = boardX - cell * 0.55;
  const x1 = boardX + gridPx + cell * 0.55;
  const w = x1 - x0;

  ctx.save();
  const g = ctx.createLinearGradient(0, y - cell * 0.75, 0, y + cell * 0.75);
  g.addColorStop(0, 'rgba(60,216,255,0)');
  g.addColorStop(0.5, 'rgba(60,216,255,0.28)');
  g.addColorStop(1, 'rgba(60,216,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(x0, y - cell * 0.75, w, cell * 1.5);

  ctx.strokeStyle = '#c4f8ff';
  ctx.lineWidth = 2.4;
  ctx.shadowColor = '#3ad8ff';
  ctx.shadowBlur = 22;
  ctx.beginPath();
  ctx.moveTo(x0, y);
  ctx.lineTo(x1, y);
  ctx.stroke();
  ctx.restore();
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt * p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }

    if (p.ring) {
      p.r += (p.maxR - p.r) * Math.min(1, dt * 12);
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 2.2;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    } else {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.vy += 120 * dt;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt * 1.6;
    f.y -= dt * 46;
    if (f.life <= 0) { floaters.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = f.color;
    ctx.font = '600 14px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = f.color;
    ctx.shadowBlur = 12;
    ctx.fillText(f.txt, f.x, f.y);
    ctx.restore();
  }
}

// ==================== 编辑器渲染 ====================
function drawEditMode() {
  ctx.save();
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  for (const n of editNotes) {
    const x = boardX + n.col * cell;
    const y = boardY + n.row * cell;

    if (n.type === 'hold') {
      const y1 = boardY + scanPos(n.beat + n.duration) * cell;
      ctx.strokeStyle = '#8affc1';
      ctx.lineWidth = cell * 0.2;
      ctx.lineCap = 'round';
      ctx.shadowColor = '#8affc1';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y1);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    ctx.fillStyle = n.type === 'hold' ? '#8affc1' : '#7ef0ff';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(x, y, cell * 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#05070c';
    ctx.font = `${cell * 0.22}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(n.beat, x, y);
  }
}

// ==================== 主循环 ====================
let lastFrame = performance.now();

function loop(now) {
  requestAnimationFrame(loop);

  const dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;

  const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.72);
  bg.addColorStop(0, '#0b1220');
  bg.addColorStop(1, '#05070c');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  drawBoard();

  // ===== 编辑模式 =====
  if (editMode) {
    drawEditMode();
    updateParticles(dt);
    return;
  }

  // ===== 预览（未开始） =====
  if (!started || !actx) {
    ctx.save();
    ctx.globalAlpha = 0.28;
    for (const n of notes) {
      const x = boardX + n.col * cell;
      const y = boardY + n.row * cell;
      ctx.strokeStyle = 'rgba(126,240,255,0.8)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(x, y, cell * 0.38, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
    return;
  }

  // ===== 游戏运行 =====
  const beats = (actx.currentTime - startTime) / BEAT;

  scheduler();

  if (aiPending && beats >= aiMoveBeat) {
    aiPending = false;
    doAIMove(beats);
  }

  drawStones();
  drawNotes(beats);
  drawScanline(scanPos(beats));
  updateParticles(dt);

  if (!ended) {
    checkMisses();
    checkHolds();
  }

  if (!ended && beats > END_BEAT) {
    ended = true;
    finish();
  }
}

// ==================== 流程 ====================
function start() {
  initAudio();
  if (actx.state === 'suspended') actx.resume();

  buildNotes();
  resetBoard();
  score = 0; combo = 0; maxCombo = 0;
  perfectCount = goodCount = badCount = missCount = 0;
  particles.length = 0;
  floaters.length = 0;
  updateHUD();

  document.getElementById('overlay').classList.add('hide');

  started = true;
  ended = false;
  startTime = actx.currentTime + 4 * BEAT + 0.4;
  nextBeatToSchedule = -4;
}

function finish() {
  const total = perfectCount + goodCount + badCount + missCount;
  const acc = total > 0
    ? ((perfectCount * 1 + goodCount * 0.6 + badCount * 0.2) / total * 100).toFixed(1)
    : '0.0';

  const ov = document.getElementById('overlay');
  ov.querySelector('h1').textContent = '终 局';
  ov.querySelector('p').innerHTML =
    '<div class="res">' +
    '得分 <em>' + score + '</em><br>' +
    '最大连击 <em>' + maxCombo + '</em><br>' +
    '准确率 <em>' + acc + '%</em><br><br>' +
    '<span style="font-size:12px;opacity:.7">' +
    'PERFECT ' + perfectCount + ' · GOOD ' + goodCount +
    ' · BAD ' + badCount + ' · MISS ' + missCount +
    '</span></div>';
  document.getElementById('btn').textContent = '再 来 一 局';
  ov.classList.remove('hide');
}

// ==================== 编辑器逻辑 ====================
function enterEdit() {
  editMode = true;
  started = false;
  ended = false;
  editNotes = CHART.map(n => ({ ...n }));
  editHistory = [];
  document.getElementById('editBar').classList.add('show');
  document.getElementById('jsonOut').classList.add('show');
  document.getElementById('editHint').classList.add('show');
  document.getElementById('overlay').classList.add('hide');
  document.getElementById('hud').style.display = 'none';
  updateEditOut();
}

function exitEdit() {
  editMode = false;
  document.getElementById('editBar').classList.remove('show');
  document.getElementById('jsonOut').classList.remove('show');
  document.getElementById('editHint').classList.remove('show');
  document.getElementById('hud').style.display = '';
  document.getElementById('overlay').classList.remove('hide');
  document.getElementById('overlay').querySelector('h1').textContent = '弈 拍';
  document.getElementById('overlay').querySelector('p').innerHTML =
    '扫描线每经过一行，点击该行上的交叉点落子。<br>' +
    '越接近节拍，判定越高。<br>' +
    '你落黑子后，AI 会走白子。<br>' +
    '按 E 键（或右下角按钮）进入谱面编辑。<br>' +
    '开始前有 4 拍预备。';
  document.getElementById('btn').textContent = '开 始';
}

function updateEditOut() {
  document.getElementById('jsonOut').textContent = JSON.stringify(editNotes, null, 2);
}

function editPointer(px, py) {
  const c = Math.round((px - boardX) / cell);
  const r = Math.round((py - boardY) / cell);
  if (r < 0 || r >= N || c < 0 || c >= N) return;
  const nx = boardX + c * cell, ny = boardY + r * cell;
  if (Math.hypot(px - nx, py - ny) > cell * 0.7) return;

  editHistory.push(JSON.parse(JSON.stringify(editNotes)));
  if (editHistory.length > 50) editHistory.shift();

  if (editDelete) {
    // 删除该位置最近的音符
    let idx = -1, minD = Infinity;
    for (let i = 0; i < editNotes.length; i++) {
      const n = editNotes[i];
      if (n.row === r && n.col === c) {
        const d = Math.abs(n.beat - parseFloat(document.getElementById('beat').value));
        if (d < minD) { minD = d; idx = i; }
      }
    }
    if (idx >= 0) editNotes.splice(idx, 1);
  } else {
    const beat = parseFloat(document.getElementById('beat').value) || 0;
    const dur = parseFloat(document.getElementById('dur').value) || 1;
    editNotes.push({
      beat, row: r, col: c,
      type: editMode2,
      duration: editMode2 === 'hold' ? dur : 0
    });
    editNotes.sort((a, b) => a.beat - b.beat);
  }
  updateEditOut();
}

// ==================== 输入 ====================
canvas.addEventListener('pointerdown', (e) => {
  if (editMode) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    editPointer(e.clientX - rect.left, e.clientY - rect.top);
    return;
  }

  if (!started || ended || !actx) return;
  e.preventDefault();

  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;

  const c = Math.round((px - boardX) / cell);
  const r = Math.round((py - boardY) / cell);

  if (r < 0 || r >= N || c < 0 || c >= N) return;

  const nx = boardX + c * cell;
  const ny = boardY + r * cell;
  if (Math.hypot(px - nx, py - ny) > cell * 0.62) return;

  tryHit(r, c);
}, { passive: false });

canvas.addEventListener('pointerup', (e) => {
  if (!started || ended) return;
  releaseHold();
});

canvas.addEventListener('pointercancel', () => {
  if (!started || ended) return;
  releaseHold();
});

// 键盘快捷键
window.addEventListener('keydown', (e) => {
  if (e.key === 'e' || e.key === 'E') {
    if (editMode) exitEdit();
    else enterEdit();
  }
});

document.getElementById('btn').addEventListener('click', start);
document.getElementById('editToggle').addEventListener('click', () => {
  if (editMode) exitEdit();
  else enterEdit();
});

// ==================== 编辑器 UI 绑定 ====================
document.getElementById('mTap').onclick = () => {
  editMode2 = 'tap';
  editDelete = false;
  document.getElementById('mTap').classList.add('on');
  document.getElementById('mHold').classList.remove('on');
  document.getElementById('delBtn').classList.remove('on');
};

document.getElementById('mHold').onclick = () => {
  editMode2 = 'hold';
  editDelete = false;
  document.getElementById('mHold').classList.add('on');
  document.getElementById('mTap').classList.remove('on');
  document.getElementById('delBtn').classList.remove('on');
};

document.getElementById('delBtn').onclick = () => {
  editDelete = !editDelete;
  document.getElementById('delBtn').classList.toggle('on', editDelete);
};

document.getElementById('undoBtn').onclick = () => {
  if (editHistory.length) {
    editNotes = editHistory.pop();
    updateEditOut();
  }
};

document.getElementById('clearBtn').onclick = () => {
  if (!confirm('确定清空所有音符？')) return;
  editHistory.push(JSON.parse(JSON.stringify(editNotes)));
  editNotes = [];
  updateEditOut();
};

document.getElementById('copyBtn').onclick = () => {
  const txt = JSON.stringify(editNotes, null, 2);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(() => {
      alert('已复制 JSON，粘贴回代码里的 CHART 即可');
    }).catch(() => {
      alert('复制失败，请手动从下方选择复制');
    });
  } else {
    alert('当前浏览器不支持自动复制，请手动选择下方文本');
  }
};

document.getElementById('closeEdit').onclick = exitEdit;

// ==================== 启动 ====================
resize();
buildNotes();
resetBoard();
requestAnimationFrame(loop);

})();
</script>
